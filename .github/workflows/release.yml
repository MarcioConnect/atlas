name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
      default: v0.1.7

permissions:
  contents: write

jobs:
  executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check src tests
      - shell: pwsh
        run: ./tools/build_windows.ps1
      - shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 release/ATLAS-Security-Agent.exe).Hash.ToLower()
          "$hash  ATLAS-Security-Agent.exe" | Set-Content -Encoding ascii release/ATLAS-Security-Agent.exe.sha256
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$env:RELEASE_TAG" "release/ATLAS-Security-Agent.exe" "release/ATLAS-Security-Agent.exe.sha256" --clobber
